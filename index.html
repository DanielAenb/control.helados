<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Helados con Firebase</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        :root {
            --primary: #f04a22; 
            --bg-color: #f5f6fa;
            --text-color: #2f3640;
            --card-bg: #ffffff;
            --red-alert: #e84118;
            --yellow-alert: #fbc531;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        h1, h2 { margin-top: 0; }

        /* --- MENSAJES TOAST (2 segundos exactos) --- */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 100px;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 120px;
        }

        /* --- BARRA DE NAVEGACIÓN TIPO PÍLDORA --- */
        .bottom-nav-wrapper {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex;
            padding: 5px;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 14px;
            color: #7f8fa6;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .nav-item.active {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            flex: 1.2; 
        }

        /* --- COMPONENTES DE LA INTERFAZ --- */
        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 10px;
        }
        .indicator.red { background-color: var(--red-alert); }
        .indicator.yellow { background-color: var(--yellow-alert); }
        .indicator.transparent { background-color: transparent; }

        .btn-fab {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 6px 12px rgba(240, 74, 34, 0.4);
            cursor: pointer;
            border: none;
            z-index: 90;
        }

        .venta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .venta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .contador {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-count {
            background: #eee;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 15px;
        }
        .checkbox-group {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #loading {
            text-align: center;
            color: #7f8fa6;
            display: none;
        }
    </style>
</head>
<body>

    <div id="toast">Acción realizada con éxito</div>

    <div class="app-container">
        
        <!-- PANTALLA: ESCANEO -->
        <main id="screen-escaneo" class="screen active">
            <h2>Escáner</h2>
            <div class="card" style="text-align: center; padding: 40px 20px;">
                <p>Simulador de escaneo.</p>
                <p style="font-size: 12px; color: gray;">(Asegúrate de crear 'BatiBati' o 'Flips' en Stock primero)</p>
                <button class="btn-primary" onclick="window.simularEscaneo('BatiBati')">Simular Escaneo BatiBati</button>
                <button class="btn-primary" style="background-color: #2f3640;" onclick="window.simularEscaneo('Flips')">Simular Escaneo Flips</button>
            </div>
        </main>

        <!-- PANTALLA: VENTA -->
        <main id="screen-venta" class="screen">
            <h2>Venta Actual</h2>
            <div id="lista-ventas">
                <p style="text-align: center; color: #7f8fa6;">No hay helados escaneados.</p>
            </div>
        </main>

        <!-- PANTALLA: STOCK -->
        <main id="screen-stock" class="screen">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Inventario</h2>
                <button onclick="window.cargarSabores()" style="background:none; border:none; color: var(--primary); font-size:20px; cursor:pointer;">🔄</button>
            </div>
            
            <div id="loading">Cargando base de datos...</div>
            <div id="lista-stock"></div>
            
            <button class="btn-fab" onclick="window.navegarA('screen-crear')">+</button>
        </main>

        <!-- PANTALLA: DEUDAS -->
        <main id="screen-deudas" class="screen">
            <h2>Deudas</h2>
            <div class="card"><p>Pantalla en construcción...</p></div>
        </main>

        <!-- PANTALLA SECUNDARIA: CREAR SABOR -->
        <main id="screen-crear" class="screen">
            <h2>Crear Sabor (Firebase)</h2>
            <div class="card">
                <label>Nombre del Sabor:</label>
                <input type="text" id="nuevo-nombre" placeholder="Ej. BatiBati">
                
                <label>Selecciona los precios disponibles (Stock inicial: 5):</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="check-1000" onchange="window.validarCheckboxes()"> Variante 1000</label>
                    <label><input type="checkbox" id="check-2500" onchange="window.validarCheckboxes()"> Variante 2500</label>
                    <label><input type="checkbox" id="check-3500" onchange="window.validarCheckboxes()"> Variante 3500 (Único)</label>
                </div>

                <button class="btn-primary" onclick="window.guardarSaborBD()">Guardar en Firebase</button>
                <button class="btn-primary" style="background-color: #7f8fa6;" onclick="window.navegarA('screen-stock')">Cancelar</button>
            </div>
        </main>
    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="bottom-nav-wrapper">
        <div class="nav-item active" onclick="window.cambiarTab('screen-escaneo', this)"><span>📷</span> Escaneo</div>
        <div class="nav-item" onclick="window.cambiarTab('screen-venta', this)"><span>🛒</span> Venta</div>
        <div class="nav-item" onclick="window.cambiarTab('screen-stock', this)"><span>📦</span> Stock</div>
        <div class="nav-item" onclick="window.cambiarTab('screen-deudas', this)"><span>📒</span> Deudas</div>
    </nav>

    <!-- IMPORTANTE: type="module" para Firebase v10 -->
    <script type="module">
        // Importar Firebase base y Firestore
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // 1. CONFIGURACIÓN DE FIREBASE (PEGA TUS CLAVES AQUÍ)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBZNa31pBesuY21OZIFUJ-175w1Ar1-FSI",
            authDomain: "helados-0612.firebaseapp.com",
            projectId: "helados-0612",
            storageBucket: "helados-0612.firebasestorage.app",
             messagingSenderId: "683985818004",
             appId: "1:683985818004:web:e0c25c6efa0f49f64c7f81",
             measurementId: "G-BVR8BXKPDR"
};

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variables Globales de la App
        window.dbSaboresLocal = [];
        window.carritoVenta = [];

        // ==========================================
        // 2. FUNCIONES DE FIREBASE
        // ==========================================
        
        // Leer datos de Firestore
        window.cargarSabores = async function() {
            const loading = document.getElementById("loading");
            loading.style.display = "block";
            window.dbSaboresLocal = [];
            
            try {
                // Llama a la colección "sabores"
                const querySnapshot = await getDocs(collection(db, "sabores"));
                
                querySnapshot.forEach((doc) => {
                    // Guardamos los datos localmente incluyendo el ID del documento
                    window.dbSaboresLocal.push({ id: doc.id, ...doc.data() });
                });
                
                window.renderizarStock();
                window.mostrarToast("Datos cargados correctamente");
            } catch (error) {
                console.error("Error leyendo Firebase:", error);
                window.mostrarToast("Error de conexión");
            } finally {
                loading.style.display = "none";
            }
        };

        // Guardar nuevo documento en Firestore
        window.guardarSaborBD = async function() {
            const nombre = document.getElementById("nuevo-nombre").value;
            const c1000 = document.getElementById("check-1000").checked;
            const c2500 = document.getElementById("check-2500").checked;
            const c3500 = document.getElementById("check-3500").checked;

            if(!nombre) return window.mostrarToast("Ingresa un nombre");

            let nuevasVariantes = [];
            // Para el ejemplo, al crear un sabor nuevo le pondré stock 5 y 1 (para probar las alertas)
            if (c1000) nuevasVariantes.push({ precio: 1000, stock: 1 }); // Generará alerta amarilla
            if (c2500) nuevasVariantes.push({ precio: 2500, stock: 5 }); 
            if (c3500) nuevasVariantes.push({ precio: 3500, stock: 0 }); // Generará alerta roja

            if(nuevasVariantes.length === 0) return window.mostrarToast("Selecciona un precio");

            window.mostrarToast("Guardando en la nube...");

            try {
                // Guarda en la colección "sabores"
                await addDoc(collection(db, "sabores"), {
                    nombre: nombre,
                    variantes: nuevasVariantes
                });
                
                // Limpiar form
                document.getElementById("nuevo-nombre").value = "";
                document.getElementById("check-1000").checked = false;
                document.getElementById("check-2500").checked = false;
                document.getElementById("check-3500").checked = false;
                window.validarCheckboxes();

                window.navegarA('screen-stock');
                window.cargarSabores(); // Recargar datos de la nube
            } catch (e) {
                console.error("Error al añadir documento: ", e);
                window.mostrarToast("Error al guardar");
            }
        };

        // ==========================================
        // 3. LÓGICA DE INTERFAZ (UI)
        // ==========================================
        
        window.mostrarToast = function(mensaje) {
            const toast = document.getElementById("toast");
            toast.innerText = mensaje;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2000);
        };

        window.cambiarTab = function(pantallaId, elementoClick) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            elementoClick.classList.add('active');
            window.navegarA(pantallaId);
        };

        window.navegarA = function(pantallaId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(pantallaId).classList.add('active');

            if(pantallaId === 'screen-stock' && window.dbSaboresLocal.length === 0) {
                window.cargarSabores(); // Cargar la primera vez que entra a stock
            } else if(pantallaId === 'screen-stock') {
                window.renderizarStock();
            }
            if(pantallaId === 'screen-venta') window.renderizarVenta();
        };

        window.renderizarStock = function() {
            const contenedor = document.getElementById("lista-stock");
            contenedor.innerHTML = "";

            if(window.dbSaboresLocal.length === 0) {
                contenedor.innerHTML = "<p style='text-align:center;'>No hay sabores en la base de datos.</p>";
                return;
            }

            window.dbSaboresLocal.forEach(sabor => {
                let colorIndicador = "transparent";
                const sinStock = sabor.variantes.some(v => v.stock === 0);
                const stockBajo = sabor.variantes.some(v => v.stock > 0 && v.stock < 3);

                if (sinStock) colorIndicador = "red";
                else if (stockBajo) colorIndicador = "yellow";

                let htmlPrecios = sabor.variantes.map(v => `$${v.precio} (Cant: ${v.stock})`).join(" | ");

                const div = document.createElement("div");
                div.className = "card stock-item";
                div.innerHTML = `
                    <div>
                        <strong>${sabor.nombre}</strong><br>
                        <small style="color: gray;">${htmlPrecios}</small>
                    </div>
                    <div class="indicator ${colorIndicador}"></div>
                `;
                contenedor.appendChild(div);
            });
        };

        window.validarCheckboxes = function() {
            const c1000 = document.getElementById("check-1000");
            const c2500 = document.getElementById("check-2500");
            const c3500 = document.getElementById("check-3500");

            if (c3500.checked) {
                c1000.checked = false; c2500.checked = false;
                c1000.disabled = true; c2500.disabled = true;
            } else {
                c1000.disabled = false; c2500.disabled = false;
                if (c1000.checked || c2500.checked) c3500.disabled = true;
                else c3500.disabled = false;
            }
        };

        // --- LÓGICA DE VENTAS ---
        window.simularEscaneo = function(nombreBuscado) {
            // Busca en la copia local descargada de Firebase
            const productoBase = window.dbSaboresLocal.find(s => s.nombre.toLowerCase() === nombreBuscado.toLowerCase());
            
            if (productoBase) {
                let itemCarrito = JSON.parse(JSON.stringify(productoBase));
                itemCarrito.variantes.forEach(v => {
                    v.cantidad_pedida = 0;
                    v.seleccionado = false;
                });
                window.carritoVenta.push(itemCarrito);
                window.mostrarToast(`Escaneado: ${productoBase.nombre}`);
            } else {
                window.mostrarToast(`No existe en Firebase. Créalo primero en Stock.`);
            }
        };

        window.actualizarCantidad = function(itemIndex, varianteIndex, operacion) {
            let variante = window.carritoVenta[itemIndex].variantes[varianteIndex];
            if (operacion === '+' && variante.cantidad_pedida < variante.stock) {
                variante.cantidad_pedida++;
                variante.seleccionado = true;
            } else if (operacion === '-' && variante.cantidad_pedida > 0) {
                variante.cantidad_pedida--;
                if(variante.cantidad_pedida === 0) variante.seleccionado = false;
            } else if (operacion === '+' && variante.cantidad_pedida >= variante.stock) {
                window.mostrarToast("Stock insuficiente");
            }
            window.renderizarVenta();
        };

        window.toggleCheck = function(itemIndex, varianteIndex) {
            let variante = window.carritoVenta[itemIndex].variantes[varianteIndex];
            variante.seleccionado = !variante.seleccionado;
            if(variante.seleccionado && variante.cantidad_pedida === 0) {
                if(variante.stock > 0) variante.cantidad_pedida = 1;
                else {
                    window.mostrarToast("No hay stock");
                    variante.seleccionado = false;
                }
            } else if (!variante.seleccionado) {
                variante.cantidad_pedida = 0;
            }
            window.renderizarVenta();
        };

        window.renderizarVenta = function() {
            const contenedor = document.getElementById("lista-ventas");
            contenedor.innerHTML = "";

            if (window.carritoVenta.length === 0) {
                contenedor.innerHTML = '<p style="text-align: center;">No hay helados escaneados.</p>';
                return;
            }

            window.carritoVenta.forEach((item, itemIndex) => {
                const div = document.createElement("div");
                div.className = "card";

                if (item.variantes.length === 1) {
                    let v = item.variantes[0];
                    div.innerHTML = `
                        <div class="venta-header">
                            <span>${item.nombre}</span>
                            <div class="contador">
                                <button class="btn-count" onclick="window.actualizarCantidad(${itemIndex}, 0, '-')">-</button>
                                <span>${v.cantidad_pedida}</span>
                                <button class="btn-count" onclick="window.actualizarCantidad(${itemIndex}, 0, '+')">+</button>
                            </div>
                        </div>
                        <div style="color: gray;">Precio: ${v.precio} (Stock: ${v.stock})</div>
                    `;
                } 
                else {
                    let titleHTML = `<span>${item.nombre} `;
                    item.variantes.forEach((v, vIndex) => {
                        let checkedStr = v.seleccionado ? "checked" : "";
                        titleHTML += `<br><label style="font-weight:normal; font-size:14px;"><input type="checkbox" ${checkedStr} onchange="window.toggleCheck(${itemIndex}, ${vIndex})"> Variedad de $${v.precio}</label> `;
                    });
                    titleHTML += `</span>`;

                    let filasHTML = "";
                    item.variantes.forEach((v, vIndex) => {
                        filasHTML += `
                            <div class="venta-row">
                                <span style="color: gray;">Precio: ${v.precio} <small>(Stock: ${v.stock})</small></span>
                                <div class="contador">
                                    <button class="btn-count" onclick="window.actualizarCantidad(${itemIndex}, ${vIndex}, '-')">-</button>
                                    <span>${v.cantidad_pedida}</span>
                                    <button class="btn-count" onclick="window.actualizarCantidad(${itemIndex}, ${vIndex}, '+')">+</button>
                                </div>
                            </div>
                        `;
                    });

                    div.innerHTML = `
                        <div class="venta-header" style="flex-wrap: wrap;">${titleHTML}</div>
                        ${filasHTML}
                    `;
                }
                contenedor.appendChild(div);
            });
        };
    </script>
</body>
</html>
